############################################################
#
# ESP-Link to RFLink Gateway Sensor
#
############################################################
- binary_sensor:
    - name: "ESP-Link Gateway Status"
      unique_id: "esp_link_status"
      device_class: "connectivity"
      # RSSI sensor uses expire_after, so it drops to unavailable when the gateway stops reporting
      state: "{{ has_value('sensor.esp_link_controller_rssi') }}"
