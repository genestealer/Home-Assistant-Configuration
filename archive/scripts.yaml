# Archived scripts - NOT loaded by Home Assistant.
# To restore one, paste its block back into /config/scripts.yaml and reload scripts.

# Archived 2026-10-20 (irrigation v1 retired; replaced by kloggy HA-Irrigation-Version2). Was script.front_garden_lawn_irrigation_timer
front_garden_lawn_irrigation_timer:
  alias: Lawn Irrigation Timer
  sequence:
  - entity_id: switch.front_garden_lawn_irrigation_valve
    service: switch.turn_on
  - delay: 00:{{states('input_number.front_garden_lawn_irrigation_duration') | round(0)}}
  - entity_id: switch.front_garden_lawn_irrigation_valve
    service: switch.turn_off

