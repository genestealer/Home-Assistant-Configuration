# Archived 2026-10-20 (legacy Nest away mode removed). Was automation.keep_nest_thermostat_aware_of_our_presence
- id: '1576602219341'
  alias: Keep Nest thermostat aware of our presence
  description: contindion template {{ state_attr('climate.entryway', 'preset_mode')
    == Away and Eco }}
  trigger:
  - minutes: /10
    platform: time_pattern
  - event: start
    platform: homeassistant
  - entity_id: binary_sensor.huishs_away
    from: 'off'
    platform: state
    to: 'on'
  condition:
  - condition: state
    entity_id: group.mobiles_group
    state: home
  - condition: state
    entity_id: binary_sensor.huishs_away
    state: 'on'
  action:
  - data:
      away_mode: home
    service: nest.set_away_mode
  - data:
      message: Nest forced back to heat mode while you are at home.
    service: notify.google_cloud_notify

# Archived 2026-10-20 (medication stock check retired (pyscript disabled)). Was automation.check_medication_stock; category: ADHD
# Calls pyscript.check_stock, archived at archive/pyscript/check_stock.py
- id: '1732218748464'
  alias: Check Medication Stock - With Location
  description: This automation periodically triggers the pyscript.check_stock script
    to check for medication availability at nearby pharmacies based on the current
    location of person.richard. It retrieves the latitude and longitude from the person.richard
    entity and passes them, along with a configurable search radius, to the script.
  triggers:
  - at: 07:00:00
    trigger: time
  - at: 07:30:00
    trigger: time
  - at: 08:00:00
    trigger: time
  - at: 08:30:00
    trigger: time
  - at: 09:00:00
    trigger: time
  - at: 09:30:00
    trigger: time
  - at: '10:00:00'
    trigger: time
  - at: '10:30:00'
    trigger: time
  - at: '11:00:00'
    trigger: time
  - at: '11:30:00'
    trigger: time
  - at: '12:00:00'
    trigger: time
  - at: '13:30:00'
    trigger: time
  - at: '14:00:00'
    trigger: time
  - at: '14:30:00'
    trigger: time
  - at: '15:00:00'
    trigger: time
  - at: '15:30:00'
    trigger: time
  - at: '16:00:00'
    trigger: time
  - at: '16:30:00'
    trigger: time
  - at: '17:00:00'
    trigger: time
  - at: '17:30:00'
    trigger: time
  - at: '18:00:00'
    trigger: time
  - at: '18:30:00'
    trigger: time
  conditions: []
  actions:
  - data_template:
      base_lat: '{{ state_attr(''person.richard'', ''latitude'') }}'
      base_lon: '{{ state_attr(''person.richard'', ''longitude'') }}'
      distance: 60
    action: pyscript.check_stock
  mode: single

# Archived 2026-10-20 (medication stock check retired (pyscript disabled)). Was automation.notify_when_medication_is_in_stock; category: ADHD; labels: Location, Notification
# Watches sensor.adhd_medication_stock, set by archive/pyscript/check_stock.py
- id: '1732218791930'
  alias: Notify When Medication is in Stock
  description: This automation monitors the sensor.adhd_medication_stock entity, which
    is updated by the pyscript.check_stock script. When the sensor state changes to
    on, indicating that medication is available within the specified distance from
    the current location of person.richard, a notification is sent to the user.
  triggers:
  - entity_id:
    - sensor.adhd_medication_stock
    to: 'on'
    trigger: state
  actions:
  - data:
      data:
        color: blue
        channel: ADHD
        vibrationPattern: 100,500,100,500,100,500,100,500
        importance: high
        visibility: public
        notification_icon: mdi:pill
        ttl: 0
        priority: high
        sticky: 'true'
      message: 'The following stores have stock: {{ state_attr(''sensor.adhd_medication_stock'',
        ''stores'') | map(attribute=''displayName'') | join(''. '') }}

        '
      title: ADHD Medication
    action: notify.mobile_app_rich_mob_app
  mode: single

# Archived 2026-10-20 (medication stock check retired (pyscript disabled)). Was automation.notify_on_medication_stock_check_failure; category: ADHD; labels: Location, Notification
# Watches binary_sensor.adhd_medication_check_error, set by archive/pyscript/check_stock.py
- id: '1732231906963'
  alias: Notify on Medication Stock Check Failure
  description: Notify if the medication stock check script encounters an error.
  triggers:
  - entity_id:
    - binary_sensor.adhd_medication_check_error
    to: 'on'
    trigger: state
    from: 'off'
  actions:
  - data_template:
      title: Medication Stock Check Error
      message: 'The stock check script failed with the following error: {{ state_attr(''sensor.adhd_medication_stock'',
        ''error'') }}

        '
    action: notify.mobile_app_rich_mob_app
  mode: single
