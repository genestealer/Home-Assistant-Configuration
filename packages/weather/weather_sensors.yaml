####################################################
# Binary Sensors
####################################################

binary_sensor:
  - platform: trend
    sensors:
      local_rainfall_trend:
        friendly_name: Local Rainfall Trend
        entity_id: sensor.local_total_rain
        max_samples: 2

####################################################
# New style Template sensors
####################################################
template:
  - sensor:
      # Shown on the kloggy/HA-Irrigation-Version2 cycle header; forecast sensors live in includes/template/weather.yaml
      - default_entity_id: sensor.irrigation_weather_outlook
        unique_id: irrigation_weather_outlook
        name: "Irrigation weather outlook"
        icon: mdi:flower-outline
        availability: >-
          {{ has_value('sensor.openweathermap_forecast_temperature_high')
             and has_value('sensor.openweathermap_forecast_temperature_low')
             and has_value('sensor.openweathermap_forecast_precipitation')
             and has_value('sensor.openweathermap_forecast_precipitation_tomorrow') }}
        state: |-
          High {{ states('sensor.openweathermap_forecast_temperature_high') | float | round(0) }}°C, Low {{ states('sensor.openweathermap_forecast_temperature_low') | float | round(0) }}°C
          Rain today {{ states('sensor.openweathermap_forecast_precipitation') | float | round(1) }} mm
          Rain tomorrow {{ states('sensor.openweathermap_forecast_precipitation_tomorrow') | float | round(1) }} mm

      # The rain gauge is cumulative, so the statistics "change" over a window gives rainfall in that window.
      - default_entity_id: sensor.template_rain_last_24_hours
        unique_id: template_rain_last_24_hours
        name: "Local Rain 24 Hours"
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: measurement
        availability: "{{ has_value('sensor.local_rain_24_hours_statistics_raw') }}"
        state: "{{ states('sensor.local_rain_24_hours_statistics_raw') | float | round(2) }}"

      - default_entity_id: sensor.template_rain_last_24_to_48_hours
        unique_id: template_rain_last_24_to_48_hours
        name: "Local Rain Previous 24 Hours"
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: measurement
        availability: >-
          {{ has_value('sensor.local_rain_48_hours_statistics_raw')
             and has_value('sensor.local_rain_24_hours_statistics_raw') }}
        state: >-
          {{ (states('sensor.local_rain_48_hours_statistics_raw') | float
              - states('sensor.local_rain_24_hours_statistics_raw') | float) | round(2) }}

      - name: "Yesterdays Local Total Rain"
        unique_id: yesterdays_local_total_rain
        unit_of_measurement: "mm"
        device_class: precipitation
        state_class: measurement
        availability: "{{ state_attr('sensor.local_daily_rain_meter', 'last_period') is not none }}"
        state: "{{ state_attr('sensor.local_daily_rain_meter', 'last_period') | float | round(2) }}"

  # Used by kloggy/HA-Irrigation-Version2; All Irrigation Controllers Online also drives the alert below.
  - binary_sensor:
      - name: Raining Now
        unique_id: raining_now
        state: "{{ is_state('sensor.internet_precipitation_kind', 'Rain') }}"

      - name: All Irrigation Controllers Online
        unique_id: all_irrigation_controllers_online
        state: "{{ is_state('binary_sensor.back_garden_irrigation_controller_online', 'on') and is_state('binary_sensor.front_garden_irrigation_controller_online', 'on') }}"

####################################################
# rflink 433mhz Weather Station sensors
####################################################
rflink:
  sensor:
    devices:
      # RFLINK misidentifies the UV sensor as a temperature sensor
      alectov5_00a3_temp:
        sensor_type: uv_intensity
        name: "Local UV Intensity"
        aliases:
          - alectov5_30d1_temp
          - alectov5_0046_temp

      # RFLINK misidentifies the rain sensor as a light intensity sensor
      alectov5_00a3_rain:
        sensor_type: light_intensity
        name: "Local Light Intensity"
        aliases:
          - alectov5_30d1_rain
          - alectov5_0046_rain

      # alectov5_00a3_update_time:
      #   sensor_type: timestamp
      #   name: "Weather Station Update Time A"
      #   aliases:
      #     - alectov5_30d1_update_time
      #     - alectov5_0046_update_time

      dkw2012_0045_temp:
        sensor_type: temperature
        name: "Local Outside Temperature"
        aliases:
          - dkw2012_007d_temp
          - dkw2012_00d0_temp
          - dkw2012_003b_temp
          - dkw2012_002c_temp

      dkw2012_0045_hum:
        sensor_type: humidity
        name: "Local Outside Humidity"
        aliases:
          - dkw2012_007d_hum
          - dkw2012_00d0_hum
          - dkw2012_003b_hum
          - dkw2012_002c_hum

      # python-rflink reports WINSP readings under the "_wind" suffix, so "_winsp" never arrives
      dkw2012_0045_wind:
        sensor_type: windspeed
        name: "Local Wind Speed"
        aliases:
          - dkw2012_007d_wind
          - dkw2012_00d0_wind
          - dkw2012_003b_wind
          - dkw2012_002c_wind

      dkw2012_0045_wings:
        sensor_type: windgusts
        name: "Local Wind Speed Gusts"
        aliases:
          - dkw2012_007d_wings
          - dkw2012_00d0_wings
          - dkw2012_003b_wings
          - dkw2012_002c_wings

      dkw2012_0045_rain:
        sensor_type: total_rain
        name: "Local Total Rain"
        aliases:
          - dkw2012_007d_rain
          - dkw2012_00d0_rain
          - dkw2012_003b_rain
          - dkw2012_002c_rain

      dkw2012_0045_windir:
        sensor_type: winddirection
        name: "Local Wind Direction"
        aliases:
          - dkw2012_007d_windir
          - dkw2012_00d0_windir
          - dkw2012_003b_windir
          - dkw2012_002c_windir



      dkw2012_0045_bat:
        sensor_type: battery
        name: "Weather Station Battery"
        aliases:
          - dkw2012_007d_bat
          - dkw2012_00d0_bat
          - dkw2012_003b_bat
          - dkw2012_002c_bat

      dkw2012_002c_update_time:
        sensor_type: timestamp
        name: "Weather Station Update Time"
        aliases:
          - dkw2012_007d_update_time
          - dkw2012_00d0_update_time
          - dkw2012_003b_update_time
          - dkw2012_0045_update_time

sensor:
  - platform: statistics
    name: Local Rain 24 Hours Statistics Raw
    unique_id: local_rain_24_hours_statistics_raw
    entity_id: sensor.local_total_rain
    state_characteristic: change
    sampling_size: 4320 # Enough for 3 readings a minute
    max_age:
      hours: 24
  - platform: statistics
    name: Local Rain 48 Hours Statistics Raw
    unique_id: local_rain_48_hours_statistics_raw
    entity_id: sensor.local_total_rain
    state_characteristic: change
    sampling_size: 8640 # Enough for 3 readings a minute
    max_age:
      hours: 48

  - platform: statistics
    name: Local Rain 30 Min Statistics Raw
    unique_id: local_rain_30_min_statistics_raw
    entity_id: sensor.local_total_rain
    state_characteristic: change
    sampling_size: 180
    max_age:
      minutes: 30

# https://www.home-assistant.io/integrations/utility_meter/
utility_meter:
  rain_meter:
    source: sensor.local_total_rain
    name: Local Rainfall
    unique_id: local_rain_meter
  daily_rain_meter:
    source: sensor.local_total_rain
    name: Daily Local Rain
    unique_id: daily_rain_meter
    cycle: daily
  weekly_rain_meter:
    source: sensor.local_total_rain
    name: Weekly Local Rain
    unique_id: weekly_rain_meter
    cycle: weekly

# https://www.home-assistant.io/integrations/alert/
alert:
  irrigation_controller_alert:
    name: Irrigation Controllers Alert
    done_message: Irrigation controllers are back online
    message: >
      {% set back = is_state('binary_sensor.back_garden_irrigation_controller_online', 'on') %}
      {% set front = is_state('binary_sensor.front_garden_irrigation_controller_online', 'on') %}
      {% if not back and not front %}Back and front garden irrigation controllers are offline
      {%- elif not back %}Back garden irrigation controller went offline
      {%- elif not front %}Front garden irrigation controller went offline
      {%- else %}Irrigation controller went offline
      {%- endif %}
    entity_id: binary_sensor.all_irrigation_controllers_online
    state: "off"
    repeat:
      - 60
      - 120
      - 240
    can_acknowledge: true
    skip_first: true
    data:
      channel: Irrigation
      importance: default
      visibility: public
      notification_icon: mdi:water-alert-outline
    notifiers:
      - mobile_app_rich_mob_app
