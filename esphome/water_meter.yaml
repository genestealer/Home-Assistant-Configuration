      ref: develop 
      path: ESPHOME-release
    components: [ everblu_meter ]
    refresh: 0s


spi:
  id: main_bus
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12


##############################################################
# Home Assistant Sub-Devices
# Each meter appears as its own device in Home Assistant. Per-meter
# entities reference these via `device_id:`. Shared-radio entities
# (CC1101 state/connected, firmware, frequency calibration) are left
# without a device_id so they stay on the main ${friendly_name} node.
##############################################################
esphome:
  devices:
    - id: water_meter_device_1
      name: "${meter_1_prefix}"
    - id: water_meter_device_2
      name: "${meter_2_prefix}"
    - id: water_meter_device_3
      name: "${meter_3_prefix}"


everblu_meter:
  - id: water_meter_1
    meter_code: "20-0257750-100"
    meter_type: water
    debug_cc1101: true
    spi_id: main_bus
    cs_pin:
      number: ${cc1101_cs}
      allow_other_uses: true
    gdo0_pin:
      number: ${cc1101_gdo0}
      allow_other_uses: true
    gdo2_pin:
      number: ${cc1101_gdo2}
      allow_other_uses: true

    # rx_attenuation: 0     # Optional (v3.0.0+): LNA gain limit (0/6/12/18 dB). All meters share the
    #                       # CC1101 hardware, so set the same value on every entry.
    #                       # Only needed when *** NEAR-FIELD SATURATION DETECTED *** is logged.
    time_id: homeassistant_time
    timezone_offset: ${tz_offset_min}
    read_hour: 11
    read_minute: 30

    request_reading_button:
      name: "${meter_1_prefix} Read Meter Now"
      device_id: water_meter_device_1
    frequency: 433.88293
    scan_button:
      name: "${meter_1_prefix} Frequency Scan"
      device_id: water_meter_device_1
    deep_scan_button:
      name: "${meter_1_prefix} Deep Frequency Scan"
      device_id: water_meter_device_1
    reset_frequency_button:
      name: "${meter_1_prefix} Reset Frequency Offset"
      device_id: water_meter_device_1
    stop_reading_button:
      name: "${meter_1_prefix} Stop Reading"
      device_id: water_meter_device_1

    volume:
      name: "${meter_1_prefix} Water Volume"
      device_id: water_meter_device_1
    counter:
      name: "${meter_1_prefix} Read Counter"
      device_id: water_meter_device_1
    battery:
      name: "${meter_1_prefix} Meter Battery"
      device_id: water_meter_device_1
    rssi:
      name: "${meter_1_prefix} Meter RSSI"
      device_id: water_meter_device_1
    rssi_percentage:
      name: "${meter_1_prefix} RSSI Percentage"
      device_id: water_meter_device_1
    lqi:
      name: "${meter_1_prefix} LQI"
      device_id: water_meter_device_1
    lqi_percentage:
      name: "${meter_1_prefix} LQI Percentage"
      device_id: water_meter_device_1

    total_attempts:
      name: "${meter_1_prefix} Total Read Attempts"
      device_id: water_meter_device_1
    successful_reads:
      name: "${meter_1_prefix} Successful Reads"
      device_id: water_meter_device_1
    failed_reads:
      name: "${meter_1_prefix} Failed Reads"
      device_id: water_meter_device_1
    frequency_offset:
      name: "${meter_1_prefix} Frequency Offset"
      device_id: water_meter_device_1
    tuned_frequency:
      name: "${meter_1_prefix} Tuned Frequency (MHz)"
      device_id: water_meter_device_1
    frequency_estimate:
      name: "${meter_1_prefix} Frequency Estimate"
      device_id: water_meter_device_1

    meter_serial_sensor:
      name: "${meter_1_prefix} Meter Serial"
      device_id: water_meter_device_1
    meter_year_sensor:
      name: "${meter_1_prefix} Meter Year"
      device_id: water_meter_device_1
    meter_clock_sensor:
