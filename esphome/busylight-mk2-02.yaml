##############################################################
# Richard Huish 2026
# ESPHome Configuration - Busy Light 2 (Kitchen)
# Repository: https://github.com/genestealer/Home-Assistant-Configuration
#
# Description:
# This ESPHome configuration drives a kitchen status indicator built
# on an M5Stack Atom ESP32. A Neopixel LED shows the current energy
# state (Octopus off-peak, solar, battery) and an OLED unit displays
# Octopus off-peak windows plus car/house battery and power figures.
#
# Includes shared configurations from the 'common' directory
#
# Features:
# - Neopixel LED Busy Light for energy/presence indication.
# - 1.3" OLED with rotating Octopus and power/battery pages.
# - Presence-based blanking and burn-in protection (auto-invert).
# - Wi-Fi connectivity for Home Assistant integration.
# - M5Stack Atom GPIO0 voltage compensation for Wi-Fi sensitivity.
#
# Hardware:
# - M5Stack Atom ESP32 (Wi-Fi Microcontroller)
# - SK6812 Neopixel RGB LED (Presence Indicator)
# - M5Stack OLED Unit 1.3" (U119), SH1107 128x64, I2C on Grove Port A
#
##############################################################

# Substitutions - Easily Configurable Parameters
substitutions:
  # Naming & Identification
  name: busy-light-mk2-2
  friendly_name: "Busy Light 2"
  ui_comment: "Busy Light 2 Kitchen"

  # Network Configuration (Static IP)
  ip: 192.168.2.53
  gateway: 192.168.2.1
  subnet: 255.255.255.0

  # Debug Logging
  # TEMPORARY: DEBUG while chasing the OLED flicker - watch for i2c/ssd1306
  # write errors and brownout resets. Set back to WARN once diagnosed.
  log_level: DEBUG

  # Sensor Update Interval
  sensor_update_interval: 1min
  wifi_sensor_update_interval: 10min

##############################################################
# Board Configuration
##############################################################
esp32:
  board: m5stack-atom
  framework:
    type: esp-idf

##############################################################
# Import Shared Code (Common Components)
##############################################################
packages:
  device_base: !include common/device_base.yaml
  wifi: !include common/device_base_wifi.yaml
  m5stack_atom_wifi_fix: !include common/m5stack_atom_wifi_fix.yaml

##############################################################
# Sub-Devices (group the OLED entities under a separate device)
##############################################################
esphome:
  devices:
    - id: oled_display_device
      name: "OLED Display"
  # Ensure the config compiles on versions that support sub-devices
  min_version: "2025.10.0"

##############################################################
# Hardware Configuration
##############################################################

# Neopixel RGB LED (Busy Light)
light:
  - platform: esp32_rmt_led_strip
    pin: 27
    num_leds: 1
    name: "Busy Light"
    id: busy_light
    chipset: SK6812
    channel_colors: GRB

# I2C Bus Configuration
# M5Stack Atom Grove Port A: SDA = GPIO26, SCL = GPIO32
i2c:
  sda: 26
  scl: 32
  scan: true
  # Fast-mode. A full 1KB frame takes ~180ms at the 50kHz default, which is slow
  # enough to see the redraw tear across the panel; ~23ms here.
  frequency: 400kHz

##############################################################
# OLED Display - M5Stack OLED Unit 1.3" (U119)
# https://shop.m5stack.com/products/oled-unit-1-3-128-64-display
# 128x64 pixels, SH1107 controller, I2C address 0x3C, on Port A (I2C)
# https://esphome.io/components/display/ssd1306/
#
# NOTE: This M5Stack SH1107 128x64 panel renders shifted/half-corrupted
# unless flip_x/flip_y are disabled and offset_y is set to 96.
# See: https://github.com/esphome/issues/issues/2913
##############################################################
font:
  # Spleen: a pixel-perfect monospaced bitmap font, very readable on 1-bit OLEDs.
  # Loaded as a .bdf at build time. Sizes: 5x8, 6x12, 8x16, 12x24 (pick by filename).
  # https://github.com/fcambus/spleen
  - file:
      type: web
      url: "https://raw.githubusercontent.com/fcambus/spleen/2.1.0/spleen-6x12.bdf"
    id: font_roboto
    size: 12
  # Material Design Icons (downloaded & cached at build time) for the status icon.
  # Codepoints from https://pictogrammers.com/library/mdi/
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/v7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: font_mdi
    size: 28
    glyphs:
      - "\U000F032A"  # mdi:leaf  -> off-peak (cheap/green)
      - "\U000F0241"  # mdi:flash -> peak (expensive)

# Text field exposed to Home Assistant so you can set the OLED message.
text:
  - platform: template
    device_id: oled_display_device
    name: "OLED Message"
    id: oled_message
    optimistic: true
    mode: text
    min_length: 0
    max_length: 255
    restore_value: true
    initial_value: "Busy Light 2"
    set_action:
      - globals.set:
          id: display_message
          value: !lambda "return x;"

##############################################################
# Octopus Energy off-peak data (imported from Home Assistant)
# Reads the off-peak binary sensor state plus the current/next
# window start & end times (ISO strings) for display below.
##############################################################
binary_sensor:
  - platform: homeassistant
    id: octopus_off_peak
    entity_id: binary_sensor.octopus_energy_electricity_22l3177538_1413225971001_off_peak
    # Busy Light -> green when off-peak, red when peak (respects presence)
    on_state:
      - script.execute: update_busy_light
  # Kitchen presence -> used to blank the OLED when empty (burn-in protection)
  - platform: homeassistant
    id: kitchen_occupancy_1
    entity_id: binary_sensor.kitchen_motion_detector_1_presence
  - platform: homeassistant
    id: kitchen_occupancy_2
    entity_id: binary_sensor.kitchen_motion_detector_2_presence
  # Either detector, held on for 10 minutes after the last motion so the OLED
  # and Busy Light do not blink off during short gaps in detection.
  - platform: template
    id: kitchen_active
    internal: true
    lambda: |-
      return id(kitchen_occupancy_1).state || id(kitchen_occupancy_2).state;
    filters:
      - delayed_off: 10min
    on_state:
      - script.execute: update_busy_light


text_sensor:
  - platform: homeassistant
    id: op_current_start
    entity_id: binary_sensor.octopus_energy_electricity_22l3177538_1413225971001_off_peak
    attribute: current_start
  - platform: homeassistant
    id: op_current_end
    entity_id: binary_sensor.octopus_energy_electricity_22l3177538_1413225971001_off_peak
    attribute: current_end
  - platform: homeassistant
    id: op_next_start
    entity_id: binary_sensor.octopus_energy_electricity_22l3177538_1413225971001_off_peak
    attribute: next_start
  - platform: homeassistant
    id: op_next_end
    entity_id: binary_sensor.octopus_energy_electricity_22l3177538_1413225971001_off_peak
    attribute: next_end
  # Eaton xStorage current operation mode (select entity -> string state)
  - platform: homeassistant
    id: house_mode
    entity_id: select.eaton_xstorage_home_current_operation_mode
  # Sun state ('above_horizon' / 'below_horizon') -> LED brightness.
  # Full brightness during daylight so the light stays visible in a bright
  # kitchen; dimmed after dark.
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun
    on_value:
      - script.execute: update_busy_light
  # TEMPORARY: flicker diagnostics. A brownout reset here means the 5V rail is
  # sagging, which also explains a panel that never re-initialises.
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: "diagnostic"

##############################################################
# TEMPORARY: flicker diagnostics - remove once the OLED is stable
##############################################################
debug:
  update_interval: 30s

##############################################################
# Battery / charging sensors (imported from Home Assistant)
# Used by the second OLED screen to show car & house battery
# charge levels and charging power.
##############################################################
sensor:
  - platform: homeassistant
    id: car_battery
    entity_id: sensor.skoda_enyaq_battery_percentage
  - platform: homeassistant
    id: car_charge_power
    entity_id: sensor.skoda_enyaq_charging_power
  - platform: homeassistant
    id: house_battery
    entity_id: sensor.eaton_xstorage_home_battery_state_of_charge
  - platform: homeassistant
    id: house_power
    entity_id: sensor.db2_energy_meters_power_a
    on_value:
      - script.execute: update_busy_light
  - platform: homeassistant
    id: battery_backup_level
    entity_id: number.eaton_xstorage_home_battery_backup_level
  - platform: homeassistant
    id: solar_power
    entity_id: sensor.solar_panels_current_power_production_watts
  - platform: homeassistant
    id: grid_power
    entity_id: sensor.solar_panels_current_net_power_consumption_watts
  # TEMPORARY: loop_time spikes show the display write blocking the main loop.
  - platform: debug
    free:
      name: "Heap Free"
      entity_category: "diagnostic"
    loop_time:
      name: "Loop Time"
      entity_category: "diagnostic"

##############################################################
# Display burn-in protection - periodic colour inversion
# The switch enables/disables the automatic inversion; the
# interval flips the invert state while the switch is on.
##############################################################
switch:
  - platform: template
    device_id: oled_display_device
    name: "Display Auto-Invert"
    id: display_auto_invert
    icon: "mdi:invert-colors"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_off_action:
      # Return to a normal (non-inverted) image when disabled
      - globals.set:
          id: display_invert
          value: "false"
  # Manual invert - directly flips the image. State tracks the invert global,
  # so it stays in sync even when the auto-invert interval toggles it.
  - platform: template
    device_id: oled_display_device
    name: "Display Invert"
    id: display_invert_switch
    icon: "mdi:invert-colors"
    lambda: |-
      return id(display_invert);
    turn_on_action:
      - globals.set:
          id: display_invert
          value: "true"
    turn_off_action:
      - globals.set:
          id: display_invert
          value: "false"

##############################################################
# Busy Light update script
# Central place that decides the LED colour/state so it can be
# triggered immediately from presence or off-peak changes (and
# as a periodic fallback from the interval below).
##############################################################
script:
  - id: update_busy_light
    then:
      - lambda: |-
          if (!id(kitchen_active).state) {
            id(busy_light).turn_off().perform();
            return;
          }
          auto call = id(busy_light).turn_on();
          // Full brightness in daylight, dimmed after sunset.
          bool daytime = id(sun_state).has_state() &&
                         id(sun_state).state == "above_horizon";
          call.set_brightness(daytime ? 1.0f : 0.5f);
          // If the house battery is discharging we are running from battery ->
          // pink. Otherwise fall back to the Octopus off-peak status
          // (green/red, or blue when no data yet).
          bool on_battery = id(house_power).has_state() && id(house_power).state > 10.0f;
          if (on_battery) {
            call.set_rgb(1.0f, 0.0f, 0.5f);   // pink  = running from battery
          } else if (!id(octopus_off_peak).has_state()) {
            call.set_rgb(0.0f, 0.0f, 1.0f);   // blue  = no data from HA yet
          } else if (id(octopus_off_peak).state) {
            call.set_rgb(0.0f, 1.0f, 0.0f);   // green = off-peak
          } else {
            call.set_rgb(1.0f, 0.0f, 0.0f);   // red   = peak
          }
          call.perform();

interval:
  - interval: 1h
    then:
      - if:
          condition:
            switch.is_on: display_auto_invert
          then:
            - globals.set:
                id: display_invert
                value: !lambda "return !id(display_invert);"
  # Rotate OLED pages. Base tick is 5s: page 1 (Octopus) shows for one tick,
  # page 2 (power) for two ticks - so page 1 is displayed half as long.
  - interval: 5s
    then:
      - lambda: |-
          switch (id(page_step)) {
            case 0: id(oled_display).show_page(id(page_octopus)); break;
            case 1: id(oled_display).show_page(id(page_batteries)); break;
            default: break;  // case 2: stay on page 2 for a second tick
          }
          id(page_step) = (id(page_step) + 1) % 3;
  # Keep the Busy Light in sync with the off-peak state and display blanking.
  # Light turns off when the kitchen is empty (matches OLED blanking) and turns
  # back on when someone is present - 100% brightness while the sun is up, 50%
  # after dark. Blue = no HA data yet.
  # Presence / off-peak / sun changes trigger the script directly; this is a
  # fallback.
  - interval: 60s
    then:
      - script.execute: update_busy_light

display:
  - platform: ssd1306_i2c
    model: "SH1107 128X64"
    address: 0x3C
    id: oled_display
    rotation: 0°
    # M5Stack 1.3" SH1107 panel needs these to avoid the shifted/half-corrupted
    # image. See: https://github.com/esphome/issues/issues/2913
    flip_x: false
    flip_y: false
    offset_x: 0
    offset_y: 96
    # Panel is mounted portrait: at rotation 0° the area is 64 wide x 128 tall.
    # Two pages are rotated by the interval below:
    #  1) Octopus off-peak status + current/next window times.
    #  2) Car & house battery charge levels and charging power.
    pages:
      # ---- Page 1: Octopus off-peak status ----
      - id: page_octopus
        lambda: |-
          // Burn-in protection: keep the screen blank while the kitchen is empty.
          // ESPHome clears the buffer before each render, so returning here leaves
          // every pixel off (no light = no burn-in).
          if (!id(kitchen_active).state) {
            return;
          }

          // Burn-in protection: periodically invert. When inverted, fill the
          // background and draw everything in the "off" colour (fg).
          auto fg = id(display_invert) ? COLOR_OFF : COLOR_ON;
          if (id(display_invert)) {
            it.fill(COLOR_ON);
          }

          // Format an ISO8601 datetime (e.g. 2026-07-06T15:00:00+01:00) as "3:00PM".
          auto fmt = [](const std::string &iso) -> std::string {
            if (iso.length() < 16) return "--";
            int h = atoi(iso.substr(11, 2).c_str());
            int m = atoi(iso.substr(14, 2).c_str());
            const char *ap = (h < 12) ? "AM" : "PM";
            int h12 = h % 12;
            if (h12 == 0) h12 = 12;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d%s", h12, m, ap);
            return std::string(buf);
          };

          // Status icon at the top (leaf = off-peak, flash = peak), centred.
          it.printf(32, 0, id(font_mdi), fg, TextAlign::TOP_CENTER,
                    id(octopus_off_peak).state ? "\U000F032A" : "\U000F0241");

          // Status word
          it.printf(32, 30, id(font_roboto), fg, TextAlign::TOP_CENTER,
                    "%s", id(octopus_off_peak).state ? "OFF-PEAK" : "PEAK");

          // Current window (only populated while an off-peak window is active)
          it.printf(0, 46, id(font_roboto), fg, "Now:");
          if (id(op_current_start).has_state() && id(op_current_start).state.length() >= 16) {
            it.printf(0, 60, id(font_roboto), fg, "%s", fmt(id(op_current_start).state).c_str());
            it.printf(0, 73, id(font_roboto), fg, "-%s", fmt(id(op_current_end).state).c_str());
          } else {
            it.printf(0, 60, id(font_roboto), fg, "--");
          }

          // Next window
          it.printf(0, 88, id(font_roboto), fg, "Next:");
          it.printf(0, 102, id(font_roboto), fg, "%s", fmt(id(op_next_start).state).c_str());
          it.printf(0, 115, id(font_roboto), fg, "-%s", fmt(id(op_next_end).state).c_str());

      # ---- Page 2: Car, house, solar & grid ----
      - id: page_batteries
        lambda: |-
          // Burn-in protection: keep the screen blank while the kitchen is empty.
          if (!id(kitchen_active).state) {
            return;
          }

          // Burn-in protection: periodically invert.
          auto fg = id(display_invert) ? COLOR_OFF : COLOR_ON;
          if (id(display_invert)) {
            it.fill(COLOR_ON);
          }

          // HA sensors publish NAN when the source entity is 'unavailable'.
          // has_state() stays true in that case, so test the value instead.
          auto ok = [](float v) -> bool { return !std::isnan(v); };

          // Draw a horizontal battery icon filled to pct (0-100). The bar always
          // shows the true level; dir animates flow across the fill:
          //   +1 charging   -> pulses sweep left->right (energy flowing in)
          //   -1 discharging -> pulses sweep right->left (energy flowing out)
          //    0 idle        -> static solid fill
          // (1-bit panel, so "pulses" are moving dark gaps rather than true grey.)
          auto draw_batt = [&](int x, int y, float pct, int dir, float pct_min = 0.0f) {
            const int w = 40, h = 12, term_w = 3, term_h = 6;
            it.rectangle(x, y, w, h, fg);                                   // body
            it.filled_rectangle(x + w, y + (h - term_h) / 2, term_w, term_h, fg); // terminal
            int ix = x + 2, iy = y + 2, iw = w - 4, ih = h - 4;
            // Never let a NaN reach the integer maths below - (int)NaN is
            // undefined and produced a garbage fill width / runaway loop.
            if (std::isnan(pct)) pct = 0.0f;
            if (std::isnan(pct_min)) pct_min = 0.0f;
            // Rescale so the bar reads empty at pct_min and full at 100 (e.g. the
            // house battery only discharges down to its backup level, not 0%).
            float span = 100.0f - pct_min;
            if (span > 0.0f) pct = (pct - pct_min) / span * 100.0f;
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            int fillw = (int)(iw * pct / 100.0f + 0.5f);
            if (fillw < 0) fillw = 0;
            if (fillw > iw) fillw = iw;
            if (fillw > 0) it.filled_rectangle(ix, iy, fillw, ih, fg);      // true level
            // Flow animation: a scrolling barber-pole of gaps over the fill.
            if (dir != 0 && fillw > 2) {
              auto bg = id(display_invert) ? COLOR_ON : COLOR_OFF;
              const int period = 10;  // spacing between pulses (px)
              const int pw = 2;       // pulse (gap) width (px)
              int t = millis() / 500; // advance ~1px every 500ms
              int phase = (((dir < 0 ? -t : t) % period) + period) % period;
              for (int gx = -period; gx <= fillw; gx += period) {
                int start = ix + gx + phase;
                int end = start + pw;
                if (start < ix) start = ix;
                if (end > ix + fillw) end = ix + fillw;
                if (end > start) it.filled_rectangle(start, iy, end - start, ih, bg);
              }
            }
          };

          // ---- Grid (net consumption): +ve import, -ve export ----
          if (ok(id(grid_power).state)) {
            float g = id(grid_power).state;
            if (g > 10.0f) {
              it.printf(0, 0, id(font_roboto), fg, "Grd I %.0fW", g);
            } else if (g < -10.0f) {
              it.printf(0, 0, id(font_roboto), fg, "Grd E %.0fW", -g);
            } else {
              it.printf(0, 0, id(font_roboto), fg, "Grd %.0fW", fabs(g));
            }
          } else {
            it.printf(0, 0, id(font_roboto), fg, "Grd --");
          }

          // ---- Solar production ----
          if (ok(id(solar_power).state)) {
            it.printf(0, 13, id(font_roboto), fg, "Sol %.0fW", id(solar_power).state);
          } else {
            it.printf(0, 13, id(font_roboto), fg, "Sol --");
          }

          // ---- House battery (Eaton xStorage) ----
          // db2_energy_meters_power_a: +ve = discharging, -ve = charging.
          int house_dir = 0;
          if (ok(id(house_power).state)) {
            if (id(house_power).state < -10.0f) house_dir = 1;             // charging
            else if (id(house_power).state > 10.0f) house_dir = -1;        // discharging
          }
          if (ok(id(house_battery).state)) {
            it.printf(0, 28, id(font_roboto), fg, "Bat %.0f%%", id(house_battery).state);
            draw_batt(2, 41, id(house_battery).state, house_dir,
                      ok(id(battery_backup_level).state) ? id(battery_backup_level).state : 0.0f);
          } else {
            it.printf(0, 28, id(font_roboto), fg, "Bat --");
          }
          if (ok(id(house_power).state)) {
            float p = id(house_power).state;
            const char *state = (p > 10.0f) ? "Dis" : (p < -10.0f) ? "Chg" : "Idle";
            it.printf(0, 55, id(font_roboto), fg, " %s %.0fW", state, fabs(p));
          }
          // Eaton current operation mode, shortened to fit the 64px panel.
          if (id(house_mode).has_state()) {
            std::string m = id(house_mode).state;
            const char *shortm = m.c_str();
            if (m == "Maximize Auto Consumption") shortm = "SelfComp";
            else if (m == "Manual Charge") shortm = "Chrg";
            else if (m == "Basic Mode") shortm = "Idle";
            it.printf(0, 68, id(font_roboto), fg, " %s", shortm);
          }

          // ---- Car (Skoda Enyaq) ----
          int car_dir = (ok(id(car_charge_power).state) && id(car_charge_power).state > 0.1f) ? 1 : 0;
          if (ok(id(car_battery).state)) {
            it.printf(0, 84, id(font_roboto), fg, "Car %.0f%%", id(car_battery).state);
            draw_batt(2, 97, id(car_battery).state, car_dir);
          } else {
            it.printf(0, 84, id(font_roboto), fg, "Car --");
          }
          if (ok(id(car_charge_power).state)) {
            it.printf(0, 111, id(font_roboto), fg, " %.1fkW", id(car_charge_power).state);
          }

##############################################################
# Globals
##############################################################
globals:
   # Message shown on the OLED, set from Home Assistant. Persisted across reboots.
   - id: display_message
     type: std::string
     restore_value: true
     initial_value: '"Busy Light 2"'
   # Burn-in protection: current invert state, toggled periodically.
   - id: display_invert
     type: bool
     restore_value: false
     initial_value: "false"
   # Page rotation step: page 1 shows for 1 tick, page 2 for 2 ticks (half the time).
   - id: page_step
     type: int
     restore_value: false
     initial_value: "0"
