##############################################################
# Doorbell Event (Google Home announces it as a doorbell press)
##############################################################
event:
  - platform: template
    id: doorbell_event
    name: "Front Door"
    device_class: doorbell
    event_types:
      - ring

##############################################################
# Doorbell Relay (Controls the Buzzer/Chime)
##############################################################

switch:
  # Doorbell relay output, pull low (to GND) to switch relay on.
  # Not exposed to home assistant.
  - platform: gpio
    pin:
      number: D1  # GPIO05 - Relay control
      mode: OUTPUT_OPEN_DRAIN # As we want to sink current from the opto-isolated relay.
      inverted: true
    id: bellRelay
    on_turn_on:
      then:
        - if:
            condition:
              lambda: 'return id(homeassistant_time).now().hour > id(nighttime_start) || id(homeassistant_time).now().hour < id(nighttime_stop);'
            then:
              - logger.log: "Doorbell pushed at nighttime"
              - delay: 1000ms
              - switch.turn_off: bellRelay
            else:
              - logger.log: "Doorbell pushed at daytime"
              - delay: 2000ms
              - switch.turn_off: bellRelay
                
    # on_turn_on:
    # - delay: 500ms
    # - switch.turn_off: bellRelay

  # Pulses the Axis front door camera I/O input; an Axis event rule makes the SIP call.
  # Not exposed to home assistant.
  - platform: gpio
    pin:
      number: D6  # GPIO12 - Direct to Axis I/O input
      mode: OUTPUT_OPEN_DRAIN
      inverted: true
    id: cctvSipCallTrigger
    restore_mode: ALWAYS_OFF
    on_turn_on:
      then:
        - delay: 1000ms
        - switch.turn_off: cctvSipCallTrigger
  

#Manual method to make the bell ring, Timed on time for activating the doorbell ringer  
button:
  - platform: template
    name: "Ring Doorbell"
    icon: "mdi:alarm-bell"
    on_press:
      - switch.turn_on: bellRelay

  - platform: template
    name: "Trigger CCTV Call"
    icon: "mdi:phone-outgoing"
    on_press:
      - switch.turn_on: cctvSipCallTrigger
      
