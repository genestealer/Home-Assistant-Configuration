##############################################################
# Richard Huish 2026
# ESPHome Configuration – Doorbell Controller
# Repository: https://github.com/genestealer/Home-Assistant-Configuration
#
# Description:
# ESP8266-based smart doorbell system controlling a mechanical
# 8 V AC chime via a loft-mounted opto-isolated relay.
# Includes illuminated Neopixel button feedback and integration
# with Home Assistant for notifications and automation.
#
# Features:
# - Physical push-button detection (active low)
# - WS2812 Neopixel illumination for doorbell button
# - Relay driver for mechanical bell with quiet-hours logic
# - Home Assistant integration for alerts and remote ringing
# - Triggers Axis front door camera I/O input; camera rule makes a SIP video call
# - "Front Door" event (device_class doorbell) exposed to Google Assistant for Nest announcements
#
# Hardware:
# - NodeMCU v2 (ESP8266)
# - Loft-mounted relay module (opto-isolated, 8 V AC 1 A bell supply)
# - Doorbell button with 2× WS2812 LEDs
# - 5 V DC PoE-style power feed via Cat5
# - Axis P3265-LV front door camera (192.168.4.33), 4-pin I/O terminal block
#
# Wiring Summary:
#   D1 (GPIO5)  → Relay control output (Green/White pair to loft relay)
#   D2 (GPIO4)  → Doorbell button input (bare Green/White pair, active low)
#   D4 (GPIO2)  → Neopixel data output (Blue/Grey ribbon pair)
#   D5 (GPIO14) ← Camera pin 4, digital output (White, grey multicore; open drain to pin 1 when active, ESP pull-up)
#   D6 (GPIO12) → Camera pin 3, digital input (Green, grey multicore; active when pulled to pin 1)
#   GND         → Camera pin 1, DC ground (3× Black, grey multicore; required for both camera signals)
#   Camera pin 2 (12 V DC out) → NOT connected; would damage the ESP (Red in grey multicore is spare)
#   5V / GND    → LED power feed (ribbon Green+Purple = 5 V, Orange+Yellow = GND)
#   Separate Cat5 → 8 V AC bell power (Orange/Orange-White)
#   All grounds common between ESP, LEDs, relay and camera
#
# Camera I/O ports (fixed, not configurable):
#   Port 1 = pin 3 input  → binary_sensor.front_door_33_port_1, triggers SIP call rule
#   Port 2 = pin 4 output → switch.front_door_33_port_2, read as "Front Door CCTV Output"
#   Axis System → Accessories: both ports normal state = open circuit, Port 1 supervised off.
#   Plain config: I0 input generates when circuit Closed; I1 output Active = Closed, Bistable.
#
# Video Call (SIP) – no Home Assistant in the call path (full setup: /config/docs/doorbell-sip-video-call.md):
#   Button press → D6 pulses camera Port 1 low for 1 s (also via "Trigger CCTV Call" button)
#   → Axis event rule (Digital input Port 1 active → Make call)
#   → camera's own SIP account on sip.linphone.org (NAT traversal ICE/STUN/TURN off; via + contact rewrite on)
#   → phone account on sip.linphone.org; Linphone app on each signed-in phone rings (push)
#   Video is H.264 only (Axis SIP limit). Two-way audio: camera built-in mic + external powered speaker.
#   SIP video must be max 704x576, H.264 Baseline profile, 15 fps; higher resolution or other profiles give no video.
#   (Camera's SIP offer is fixed at profile-level-id=42000d = Baseline level 1.3, video TIAS 768 kbps.)
#   Linphone shows the video preview before answering.
#   Tested alternative: local Asterisk App (extensions 104 camera / 105 phone) in
#   /addon_configs/3e533915_asterisk/asterisk/custom/pjsip_custom.conf.
#
# Home Assistant notifications on each press (in parallel with the SIP call):
#   - "Front Door" event → Google Assistant (hass-ga-manual-ui) → Nest speakers/displays chime and announce
#   - HA automation "Doorbell - Notify phones" → push notification to both phones with a still
#     snapshot from camera.front_door_33 taken at the moment of the press
#
# Quiet Hours:
#   21:00–06:00 reduced relay activation time
#
##############################################################


# Substitutions - Easily Configurable Parameters
substitutions:
  # Naming & Identification
  name: doorbell-controller
  friendly_name: "Doorbell"
  ui_comment: "Doorbell Controller"

  # Network Configuration (Static IP)
  ip: 192.168.2.36
  gateway: 192.168.2.1
  subnet: 255.255.255.0

  # Status LED Configuration
  status_led: D0  # GPIO16 - NodeMCU onboard LED
  status_led_inverted: "true"

  # Debug Logging
  log_level: WARN
  

  # Sensor Update Interval
  sensor_update_interval: 30s
  wifi_sensor_update_interval: 10min

##############################################################
# Board Configuration
##############################################################
esp8266:
  board: nodemcuv2

##############################################################
# Import Shared Code (Common Components)
##############################################################
packages:
  device_base: !include common/device_base.yaml
  status_led: !include common/status_led.yaml
  wifi: !include common/device_base_wifi.yaml
  # Uncomment below to remove the status LED from this device:
  # status_led: !remove

##############################################################
# Sub-Devices (group Electricity-related entities)            #
##############################################################
# esphome:
#   devices:

##############################################################
# Quiet Hours Configuration for Doorbell
##############################################################
globals:
  - id: nighttime_start
    type: int
    restore_value: no
    initial_value: '21'  # Quiet hours start at 9 PM
  - id: nighttime_stop
    type: int
    restore_value: no
    initial_value: '6'  # Quiet hours end at 6 AM

##############################################################
# Time Component (For Quiet Hours)
##############################################################
time:
  - platform: homeassistant
    id: homeassistant_time

##############################################################
# Neopixel LED for Doorbell Button
##############################################################

light:
  - platform: neopixelbus
    method: ESP8266_UART1
    id: doorbell_light
    type: GRB
    pin: D4  # GPIO2 - Neopixel Button Light
    num_leds: 2
    name: "Doorbell Button Lights"
    restore_mode: ALWAYS_ON
    variant: 800KBPS
    effects:
      - addressable_rainbow:
          name: Slow Rainbow Effect With Custom Values
          speed: 2
          width: 50
      - addressable_rainbow:
          name: Rainbow Effect With Custom Values
          speed: 10
          width: 50
      - addressable_color_wipe:
      - addressable_color_wipe:
          name: Color Wipe Effect With Custom Values
          colors:
            - red: 100%
              green: 100%
              blue: 100%
              num_leds: 1
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 1
          add_led_interval: 300ms
          reverse: False

##############################################################
# Doorbell Button Configuration
##############################################################

binary_sensor:
  - platform: gpio
    pin:
      number: D2  # GPIO04 - Doorbell button input
      mode: INPUT_PULLUP
      inverted: true # Active LOW
    name: "Doorbell Button"
    icon: "mdi:doorbell"
    filters:
      - delayed_on: 100ms # Prevent false triggers
      - delayed_off: 100ms # Prevent false resets
    on_press:
      then:
        - logger.log: "Doorbell Button Pressed"
        - light.turn_off:
            id: doorbell_light
        - light.turn_on:
            id: doorbell_light
            brightness: 100%
            # red: 100%
            # green: 100%
            # blue: 100%
            effect: "Color Wipe Effect With Custom Values"
        - switch.turn_on: bellRelay
        - switch.turn_on: cctvSipCallTrigger
        - event.trigger:
            id: doorbell_event
            event_type: ring
        # - delay: 250ms
        # - light.turn_on:
        #     id: doorbell_light
        #     brightness: 100%
        #     red: 0%
        #     green: 100%
        #     blue: 0%
        - delay: 2000ms # Inhibit pressing the button for a moment
        - light.turn_on:
            id: doorbell_light
            effect: "Slow Rainbow Effect With Custom Values"

  - platform: gpio
    pin:
      number: D5  # GPIO14 - From Axis I/O output
      mode: INPUT_PULLUP
      inverted: true
    name: "Front Door CCTV Output"
    icon: "mdi:cctv"


