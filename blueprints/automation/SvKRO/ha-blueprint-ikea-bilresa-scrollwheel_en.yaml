            select:
              mode: dropdown
              options:
              - label: Brightness
                value: brightness
              - label: Color
                value: hs_color
              - label: Color temperature
                value: temp_kelvin
              multiple: false
              custom_value: false
              sort: false
        input_sens_2:
          name: Multiplier
          description: Define how much the value should change with each scroll step.
          default: 5
          selector:
            number:
              min: 1.0
              max: 50.0
              unit_of_measurement: x
              mode: slider
              step: 1.0
        input_transition_2:
          name: Transition duration
          description: Define how long the transition between changes should take.
          default: 200
          selector:
            number:
              min: 0.0
              max: 5000.0
              unit_of_measurement: ms
              mode: slider
              step: 1.0
    group_single_click_2:
      name: Single Click
      icon: mdi:gesture-tap
      collapsed: true
      input:
        input_click_mode_2:
          name: Click Mode
          description: Choose between a single action or cycling through scenes.
          default: action
          selector:
            select:
              mode: dropdown
              options:
              - label: Perform single action
                value: action
              - label: Scene cycler
