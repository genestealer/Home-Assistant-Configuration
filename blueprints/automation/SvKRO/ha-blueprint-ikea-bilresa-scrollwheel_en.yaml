      name: Scroll Wheel Settings
      icon: mdi:rotate-right
      collapsed: true
      input:
        input_light_3:
          name: Light / Light Group
          description: Select the light or group to be controlled.
          default: {}
          selector:
            target:
              entity:
              - domain:
                - light
        input_mode_3:
          name: Scroll Function
          description: Define which value is changed when turning the wheel.
          default: brightness
          selector:
            select:
              mode: dropdown
              options:
              - label: Brightness
                value: brightness
              - label: Color
                value: hs_color
              - label: Color temperature
                value: temp_kelvin
              multiple: false
              custom_value: false
              sort: false
        input_sens_3:
          name: Multiplier
          description: Define how much the value should change with each scroll step.
          default: 5
          selector:
            number:
              min: 1.0
              max: 50.0
              unit_of_measurement: x
              mode: slider
